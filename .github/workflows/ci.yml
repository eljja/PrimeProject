name: PrimeProject CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PYTHONPATH: ${{ github.workspace }}

jobs:
  publication-guard:
    name: Publication Guard
    runs-on: windows-2025-vs2026
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Compile Python sources
        run: python -m compileall prime_audit scripts tests

      - name: Unit check publication consistency
        run: python -m unittest tests.test_prime_audit.PrimeAuditTests.test_publication_consistency_checks_claim_boundaries

      - name: Unit check artifact vintages
        run: python -m unittest tests.test_prime_audit.PrimeAuditTests.test_publication_consistency_fails_on_mixed_artifact_vintages

      - name: Unit check evolution metrics
        run: python -m unittest tests.test_prime_audit.PrimeAuditTests.test_project_evolution_metrics_match_public_artifacts

      - name: Unit check evidence hashes
        run: python -m unittest tests.test_prime_audit.PrimeAuditTests.test_public_evidence_pack_hashes_match_files

      - name: Unit check artifact lineage
        run: python -m unittest tests.test_prime_audit.PrimeAuditTests.test_public_artifact_lineage_matches_current_default_graph

      - name: Unit check publication reproduction
        run: python -m unittest tests.test_prime_audit.PrimeAuditTests.test_publication_reproduction_script_succeeds

      - name: Unit check latest proof-search tickets
        run: python -m unittest tests.test_ticket120_twin_low_divisor_pair_savings_audit tests.test_ticket121_twin_balance_angle_defect_audit tests.test_ticket122_twin_canonical_joint_defect_audit tests.test_ticket123_canonical_defect_ratio_closure_bridge tests.test_ticket124_canonical_obstruction_limsup_criterion tests.test_ticket125_infinite_bridge_contracts tests.test_ticket126_route_correction_audit tests.test_ticket127_exception_repair_effective_bridges tests.test_ticket128_finite_core_prefix_constant_interpolation tests.test_ticket129_enumerable_core_valuation_cap_endpoint_budget tests.test_ticket130_computability_cap_language_optimality tests.test_ticket131_proof_viability_target_correction tests.test_ticket132_admissibility_nullset_hard_stratum_local_parity tests.test_ticket133_quantifier_promotion_exact_reductions tests.test_ticket134_uniformity_thresholds_and_scale_no_go tests.test_ticket135_conditional_bridges_and_exceptional_set tests.test_ticket136_scale_sensitive_obstructions_and_affine_bridge tests.test_ticket137_cancellation_entropy_and_information_budget tests.test_ticket138_correlation_periodicity_and_scale_closure tests.test_ticket139_uniformity_diophantine_and_complexity tests.test_ticket140_spectral_moments_fixed_floor_duality_rotation tests.test_ticket141_one_sided_moving_floor_robust_dual_large_sieve tests.test_ticket142_effective_rank_cycle_direction_haar_liouville tests.test_ticket143_form_core_period_floor_martingale_walsh tests.test_ticket144_schur_rank_equivalence_variation_adverse_walsh tests.test_ticket145_normalization_affine_endpoint_separable_no_go tests.test_ticket146_toeplitz_polynomial_phase_frechet tests.test_ticket147_fiber_compensation_phase_graph tests.test_ticket148_multiscale_renewal_sharpness_matching tests.test_ticket149_smooth_escape_wheel_cover tests.test_ticket150_relative_delay_hole_parity tests.test_ticket151_negative_affine_transversal_logtwo tests.test_ticket152_compression_cylinder_energy_selection tests.test_ticket153_essential_tail_geometric_reflection_parity tests.test_ticket154_compact_suffix_wheel_leastfactor tests.test_ticket155_range_prefix_sublinear_conditional tests.test_ticket156_cutoff_potential_signed_information tests.test_ticket157_formcore_inversion_proxy_margin tests.test_ticket158_two_cutoff_localized_variation_directional tests.test_ticket159_diagonal_threshold_phase_parity tests.test_ticket160_exact_support_cylinder_bilinear_wheel tests.test_ticket161_commoncore_baker_angle_typeii tests.test_ticket162_formnorm_explicitbaker_integral_multiscale tests.test_ticket163_local_certificate_realizer_trace_carleson tests.test_ticket164_core_eigen_first_crossing_pointwise_product tests.test_ticket165_vanishing_defect_logtail_variation_signed_dual tests.test_ticket166_tail_adaptive_bandlimited_diagonal tests.test_ticket167_cofinal_residue_besov_parity tests.test_ticket168_fixedcore_leastrealizer_phase_paritymain tests.test_ticket169_kkt_childlift_autocorrelation_primepower tests.test_ticket170_interval_tail_besov_multiscale tests.test_ticket171_relative_ghost_phase_haar tests.test_ticket172_structure_equivalence_l1_variation tests.test_ticket173_finite_section_cylinder_phase_tensor tests.test_ticket174_tail_lift_adaptive_scalepair tests.test_ticket175_relative_equivalence_signed_block tests.test_ticket176_relative_cone_harmonic_alias_schur tests.test_ticket177_comparison_wheel_sobolev_crossgram tests.test_ticket178_toeplitz_lowbit_split_zeromode tests.test_ticket179_symbol_adaptive_discrete_centering tests.test_ticket180_finite_information_localization tests.test_ticket181_regularized_localization_quantized_slack tests.test_ticket182_sobolev_divisibility_translation_sibling tests.test_ticket183_abel_primitive_spectral_haar tests.test_ticket184_information_sufficiency_route_correction tests.test_ticket185_spectral_cycle_factor_granularity tests.test_ticket186_codimension_twoone_layercake_quantization tests.test_ticket187_positive_ray_threeone_signature_interval tests.test_ticket188_nested_fourone_primepower_dyadic tests.test_ticket189_corefive_sublinear_shift tests.test_ticket190_cauchy_sixone_quantifier_transfer tests.test_ticket191_probe_sevenone_budget_granularity tests.test_ticket192_uniform_eightone_weighted_envelope tests.test_ticket193_everywhere_nineone_parity_envelope tests.test_ticket194_densecore_tenone_theta_layers tests.test_ticket195_finitejet_elevenone_squarelayer tests.test_ticket196_rouche_density_overlap tests.test_ticket197_first_rectangle_run_block_sparse_collision tests.test_ticket198_verified_height_primitive_word_quantifier_strength tests.test_ticket199_symmetric_sampling_two_run_squarefree_filter tests.test_ticket200_derivative_mesh_three_run_chen_channels tests.test_ticket201_finite_information_allrun_liouville_parity tests.test_ticket202_exact_hermite_deformation_parity_scale tests.test_ticket203_rouche_transfer_pointwise_primorial tests.test_ticket204_mesh_necklace_exceptional_kernel tests.test_ticket205_winding_extremal_finite_omega tests.test_ticket206_adaptive_singleone_crt_projector

      - name: Unit check current proof-search tickets
        run: python -m unittest tests.test_ticket211_winding_density_fullrange_unitscale tests.test_ticket212_even_defect_ghost_bonferroni_gapchannel tests.test_ticket213_multiplicity_sixone_polynomial_selector tests.test_ticket214_cofinal_sevenone_exponential_cardinal tests.test_ticket215_lattice_nearcollision_exception_abel tests.test_ticket216_laplace_gcd_radix_tauberian tests.test_ticket217_relative_threshold_convergent_moment_tail tests.test_ticket218_adaptive_radius_spike_residual_surplus tests.test_ticket219_bandpass_matveev_crossfit_qualitative_abel tests.test_ticket220_dyadic_partition_primitive_refinement_crt tests.test_ticket221_sharp_obstruction_certificates tests.test_ticket222_lossless_coupling_biased_parity tests.test_ticket223_exponential_tail_local_duality_no_go tests.test_ticket224_sharp_completeness_thresholds tests.test_ticket225_arithmetic_remainder_localization

      - name: Verify open problem structure
        run: python scripts/verify_open_problem_structure.py

      - name: Verify open problem certificates
        run: python scripts/verify_open_problem_workbench.py

      - name: Reproduce publication artifacts
        run: python scripts/reproduce_publication.py

      - name: Install Playwright
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install chromium

      - name: Check JavaScript syntax
        run: |
          node --check assets/app.js
          node --check assets/open-problems.js
          node --check scripts/verify_pages.cjs

      - name: Verify GitHub Pages surface
        run: node scripts/verify_pages.cjs

      - name: Ensure committed artifacts stay in sync
        run: git diff --exit-code -- .
